name: Build & Release Rosaline APK (v1.2.2)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle from Wrapper Properties
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Generate Signing Keystores
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass rosaline123 \
              -alias upload \
              -keypass rosaline123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Rosaline,O=Abi,C=IN"
          fi

      - name: Build Signed Release APK v1.2.2
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: rosaline123
          KEY_PASSWORD: rosaline123
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Rosaline-v1.2.2.apk

      - name: Upload Rosaline v1.2.2 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rosaline-v1.2.2-APK
          path: Rosaline-v1.2.2.apk

      - name: Publish GitHub Release v1.2.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: "Rosaline v1.2.2"
          body: "Signed installable Android release APK for **Rosaline v1.2.2** (includes Product & Custom Tags, iOS-style 25% blurred sticky collapsing headers across Home, Timeline, and Settings, auto-hiding Back button on scroll, and In-App Updater)."
          files: Rosaline-v1.2.2.apk
          prerelease: false
